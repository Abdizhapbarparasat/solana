[package]
name = "tip_jar"
version = "0.1.0"
description = "Tip Jar: Solana MVP (Week 8)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "tip_jar"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
