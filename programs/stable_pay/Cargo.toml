[package]
name = "stable_pay"
version = "0.1.0"
description = "Stablecoin invoice payments (Week 13)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "stable_pay"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
